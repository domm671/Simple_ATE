# simple_ATE 工位配置（示例）
station_id = "FT_LINE1_ST03"
software_version = "0.1.0"

[sn]
# 默认不对 SN 做格式校验，任意非空 SN 均可启动测试。
# 如需按工位规则校验，置 validation_enabled = true 并按实际产品序列号规则修改 pattern。
validation_enabled = false
# pattern = "^BMS[0-9]{11}$"   # 示例：BMS + 11 位数字
auto_start = true

[storage]
sink = "file"
result_dir = "../data/results"
log_dir = "../data/logs"
trace_retain_days = 30

# M1 使用 mock；真机联调（M3）时改为 type="can" 并填写 interface/channel
[resources.can_main]
type = "mock"
mock_script = "mock/bms_can.json"
# type="can" 时使用：
# interface = "pcan"
# channel = "PCAN_USBBUS1"
# bitrate = 500000

# 串口 / USB CDC / Modbus 资源示例（需安装 pyserial：pip install -e .[serial]）。
# 也可以在脚本中用 <connect protocol="serial" port="COM3" .../> 内联定义并覆盖此处配置。
# 无硬件调试：给 serial/usb/modbus 资源加 mock_script（相对 config/ 目录），
#   用内置伪串口按 JSON 规则应答，无需 pyserial；见 scripts/serial_demo.xml。
# [resources.rs485]
# type = "serial"           # serial / usb / modbus
# port = "COM3"
# baudrate = 115200
# parity = "none"           # none/even/odd/mark/space
# stopbits = 1
# mock_script = "mock/serial_demo.json"   # 可选：无硬件模拟
#
# [resources.mb]
# type = "modbus"
# modbus_mode = "rtu"        # rtu/ascii/tcp
# port = "COM4"
# baudrate = 9600
# unit = 3

# 可选自定义 action 白名单（模块相对 extensions/ 目录）
[extensions]
dir = "../extensions"
allowed = ["sample_ext"]
