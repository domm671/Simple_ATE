[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-ate"
version = "0.1.0"
description = "Simple ATE/FT test runner (declarative CAN frame scripts)"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
simple-ate = "simple_ate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
